# Used only for authoring migrations: `uv run alembic revision --autogenerate -m "..."`.
# At runtime, `codeit db upgrade` configures Alembic in code (src/codeit/db/__init__.py).
[alembic]
script_location = src/codeit/db/alembic
sqlalchemy.url = sqlite:///data/codeit.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
