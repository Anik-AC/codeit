# CodeIt configuration (PRD 20.1). Secrets go in .env, never here.
# Model IDs are placeholders; fill them from OpenRouter's catalog at M3 and M6.
data_dir: data

project:
  jira_project_key: CODEIT
  target_repo:
    name: codeit-sandbox-app
    url: https://github.com/Anik-AC/codeit-sandbox-app.git
    default_branch: main

orchestrator:
  poll_seconds: 45
  max_review_loops: 3
  lease_ttl_minutes: { coder: 90, reviewer: 40, rebase: 30 }

slots: { planner: 1, coder: 1, reviewer: 2, rebase: 1, docs: 1, learning: 1 }

routing:
  planner:  { primary: claude_code_chat, fallback: openrouter_free }
  coder:    { primary: claude_code, fallback: opencode_paid, fallback_requires_label: allow-fallback }
  reviewer: { primary: openrouter_paid_review, fallback: openrouter_free }
  rebase:   { primary: claude_code, fallback: opencode_paid }
  # Everything except the Reviewer runs on the Claude subscription (owner, 2026-09-30).
  # The free OpenRouter list is only a backup for when Claude is usage-limited.
  docs:     { primary: claude_code_chat, fallback: openrouter_free }
  learning: { primary: claude_code_chat, fallback: openrouter_free }
  ops:      { primary: claude_code_chat, fallback: openrouter_free }

models:
  # Free models with structured-output support, from openrouter.ai/api/v1/models (2026-09-25).
  # Free IDs rotate: dead ones (404) are skipped for 24 hours. Review these when they stop working.
  openrouter_free:
    - nvidia/nemotron-3-super-120b-a12b:free
    - qwen/qwen3.8-27b:free
    - nex-agi/nex-n2.5-pro:free
  # The Reviewer: a non-Anthropic model (PRD 9.3), chosen by the owner on 2026-09-29.
  openrouter_paid_review: ["deepseek/deepseek-v4.1-flash"]
  openrouter_paid_cheap: ["<cheap-model>"]
  opencode_paid: "openrouter/<cheap-coding-model>"

claude:
  run_window: ["23:00-08:00"]
  max_concurrent_runs: 1
  max_turns: { coder: 80, rebase: 40 }
  usage_limit_patterns: ["usage limit", "limit reached", "rate limit"]

openrouter:
  daily_usd_cap: { reviewer: 0.50, docs: 0.10, ops: 0.10, coder: 1.00 }
  free_requests_daily_cap: 900

sandbox:
  image: codeit-worker:0.1.0
  # Workers reach the internet only through this proxy, and only the hosts below (ADR-0013).
  egress_proxy: true
  proxy_image: codeit-proxy:0.1.0
  cpus: 2
  mem: 4g
  pids_limit: 512
  timeouts_minutes: { coder: 60, reviewer: 30, rebase: 20 }
  egress_allowlist:
    - api.anthropic.com
    - claude.ai
    - console.anthropic.com
    - openrouter.ai
    - github.com
    - api.github.com
    - codeload.github.com
    - objects.githubusercontent.com
    - registry.npmjs.org
    - pypi.org
    - files.pythonhosted.org
    - playwright.azureedge.net
    # jira-mcp on the host (mcp.container_host:mcp.port) is added automatically.
    # The Jira site is deliberately absent: containers reach Jira only via the
    # host-side jira-mcp (PRD 15, ADR-0004).

mcp:
  host: 127.0.0.1
  port: 8765
  allowed_hosts: ["127.0.0.1:*", "localhost:*", "host.docker.internal:*"]
  container_host: host.docker.internal
  token_grace_minutes: 5

# Dashboard and API (PRD 14). Loopback only; log in with CODEIT_API_TOKEN from .env.
api:
  host: 127.0.0.1
  port: 8770

rebase:
  poll_minutes: 10
  max_files: 5
  never_auto: ["**/migrations/**", "package-lock.json", ".github/**"]

docs: { run_at: "07:00" }
learning:
  cron: "0 22 * * SUN"   # weekly, local time
  min_new_signals: 10    # or sooner, once this many new human signals are waiting
  lookback_days: 30
  check_minutes: 60
  # The eval gate (ADR-0019): run before and after a proposed change.
  gate_coder_tasks: [T004, T005, T010]
  gate_repeats: 1
  gate_review_tasks: [T001, T003, T005, T006, T009, T012]
eval: { regression_tolerance: 0.05 }
